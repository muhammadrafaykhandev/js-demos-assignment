<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 - Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Counter App</h1>
        <p class="subtitle">Scope & Closures Demo</p>
        <div class="count-display" id="count">0</div>
        <div class="btn-group">
            <button id="inc-btn" class="btn btn-inc">+</button>
            <button id="dec-btn" class="btn btn-dec">-</button>
            <button id="reset-btn" class="btn btn-reset">Reset</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
